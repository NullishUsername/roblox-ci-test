name: Deploy

on:
  # Code changes deploy automatically
  push:
    branches: [main]

  # Map-only changes: Actions -> Deploy -> Run workflow (no commit needed)
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        type: choice
        options: [test]
        default: test
      version_type:
        description: "Saved = store a version only, Published = make it live"
        type: choice
        options: [Published, Saved]
        default: Published

  # Optional: also pick up builders' map changes on a timer. Uncomment to enable.
  # schedule:
  #   - cron: "0 */6 * * *"   # every 6 hours (UTC)

permissions:
  contents: read

jobs:
  check-dispatcher:
    name: Check dispatcher
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      universe_id: ${{ steps.target.outputs.universe_id }}
      place_id: ${{ steps.target.outputs.place_id }}
      base_place_id: ${{ steps.target.outputs.base_place_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy-targets.json
          sparse-checkout-cone-mode: false

      - name: Verify actor and branch
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DEPLOYERS: ${{ vars.DEPLOYERS }}   # optional repo variable, e.g. "alice,bob"
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploys only run from main (got $GITHUB_REF)"; exit 1
          fi
          ALLOWED="${DEPLOYERS:-$OWNER}"
          case ",${ALLOWED}," in
            *",${ACTOR},"*) echo "$ACTOR is allowed to deploy" ;;
            *) echo "::error::$ACTOR is not in the deployers list ($ALLOWED)"; exit 1 ;;
          esac

      - name: Select target
        id: target
        env:
          TARGET: ${{ inputs.target || 'test' }}
        run: |
          T=$(jq -c --arg e "$TARGET" 'map(select(.environment == $e)) | first // empty' deploy-targets.json)
          if [ -z "$T" ]; then echo "::error::No target '$TARGET' in deploy-targets.json"; exit 1; fi
          if echo "$T" | grep -q REPLACE_WITH; then
            echo "::error::Fill in the IDs in deploy-targets.json"; exit 1
          fi
          {
            echo "environment=$(jq -r .environment <<<"$T")"
            echo "universe_id=$(jq -r .universe_id <<<"$T")"
            echo "place_id=$(jq -r .place_id <<<"$T")"
            echo "base_place_id=$(jq -r '.base_place_id // ""' <<<"$T")"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying to $TARGET: $T"

  publish:
    needs: check-dispatcher
    uses: ./.github/workflows/publish.yml
    with:
      environment: ${{ needs.check-dispatcher.outputs.environment }}
      universe_id: ${{ needs.check-dispatcher.outputs.universe_id }}
      place_id: ${{ needs.check-dispatcher.outputs.place_id }}
      base_place_id: ${{ needs.check-dispatcher.outputs.base_place_id }}
      version_type: ${{ inputs.version_type || 'Published' }}
    secrets: inherit
